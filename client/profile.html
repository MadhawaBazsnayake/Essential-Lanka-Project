<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Essential Lanka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/style.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .page-section { padding: 50px 5%; min-height: 85vh; position: relative; }
        .page-container { max-width: 800px; margin: 0 auto; position: relative; z-index: 10; }
        .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #666; text-decoration: none; font-weight: 700; transition: 0.3s; font-size: 1.05rem; }
        .back-btn:hover { color: #10b981; }
        .page-title { font-size: 2.2rem; font-weight: 800; color: #1a1a1a; }
        .glass-box { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 15px 40px rgba(0,0,0,0.06); padding: 40px; border-radius: 35px; animation: fadeUp 0.5s ease forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; color: #1e293b; }
        .form-control { width: 100%; padding: 14px 20px; border-radius: 16px; border: 2px solid #e2e8f0; background: #f8fafc; font-size: 1rem; transition: 0.3s; outline: none; font-family: inherit; }
        .form-control:focus { border-color: #10b981; background: #ffffff; box-shadow: 0 0 0 4px rgba(16,185,129,0.1); }
        .d-flex-gap { display: flex; gap: 20px; }
        .d-flex-gap .form-group { flex: 1; }
        .btn-submit { background: #10b981; color: white; padding: 16px 35px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; font-size: 1.05rem; box-shadow: 0 10px 25px rgba(16,185,129,0.25); display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(16,185,129,0.35); background: #059669; }
        @media (max-width: 768px) {
            .d-flex-gap { flex-direction: column; gap: 0; }
            .glass-box { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<header id="site-header"></header>

<section class="page-section bg-cream">
    <div class="mesh-bg"></div>
    <div class="page-container">
        <div class="header-action fade-up show">
            <h1 class="page-title"><i class="ph-fill ph-user-gear" style="color: #10b981;"></i> Edit Profile</h1>
            <a href="dashboard.html" class="back-btn"><i class="ph-bold ph-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="glass-box">
            <form id="profileForm">
                <div class="d-flex-gap">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="firstName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="lastName" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" disabled style="background:#e2e8f0; cursor:not-allowed;">
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="07XXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" class="form-control" placeholder="House No, Street, City">
                </div>

                <div class="form-group">
                    <label>Profile Picture (Optional)</label>
                    <input type="file" id="profilePic" class="form-control" accept="image/*" style="padding: 10px;">
                    <div id="picPreview" style="margin-top: 10px;"></div>
                </div>

                <button type="submit" class="btn-submit" id="saveBtn">
                    <i class="ph-bold ph-floppy-disk"></i> Save Profile Details
                </button>
            </form>

            <hr style="border: 0; border-top: 1.5px dashed #e2e8f0; margin: 40px 0;">

            <h3 style="font-size: 1.3rem; font-weight: 800; color: #1e293b; margin-bottom: 20px;">Change Password</h3>
            <form id="passwordForm">
                <div class="d-flex-gap">
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="newPassword" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="updatePwdBtn" style="background:#1e293b;">
                    <i class="ph-bold ph-lock-key"></i> Update Password
                </button>
            </form>
        </div>
    </div>
</section>

<footer id="site-footer"></footer>

<script type="module">
    import { loadLayout } from '../js/layout.js';
    import { supabase } from '../js/supabase-client.js';

    let currentUserId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        loadLayout();

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '../login.html'; return; }

        const { data: profile } = await supabase.from('users').select('*').eq('auth_id', session.user.id).single();
        if (!profile || profile.role !== 'client') { window.location.href = '../login.html'; return; }

        currentUserId = profile.id;

        document.getElementById('firstName').value = profile.first_name || '';
        document.getElementById('lastName').value = profile.last_name || '';
        document.getElementById('phone').value = profile.phone || '';
        document.getElementById('email').value = session.user.email || '';
        document.getElementById('address').value = session.user.user_metadata?.address || '';
        
        const initialPic = profile.profile_pic || profile.profile_image;
        if (initialPic) {
            document.getElementById('picPreview').innerHTML = \`
                <div style="display:flex; align-items:center; gap:12px; margin-top:10px;">
                    <img id="previewImgTag" src="\${initialPic}" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #10b981; box-shadow: 0 6px 15px rgba(16,185,129,0.2);">
                    <span style="font-size:0.85rem; color:#64748b; font-weight:600;">Current Photo</span>
                </div>
            \`;
        }

        // Live preview when file is selected
        document.getElementById('profilePic').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('picPreview').innerHTML = \`
                        <div style="display:flex; align-items:center; gap:12px; margin-top:10px;">
                            <img id="previewImgTag" src="\${event.target.result}" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #10b981; box-shadow: 0 6px 15px rgba(16,185,129,0.2);">
                            <span style="font-size:0.85rem; color:#10b981; font-weight:700;"><i class="ph-bold ph-check-circle"></i> New Photo Selected</span>
                        </div>
                    \`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Helper to convert image file to Base64 (DataURL) with canvas compression if needed
        function fileToDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const maxDim = 600;
                        let width = img.width;
                        let height = img.height;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.onerror = () => resolve(e.target.result);
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Save Profile Form
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const ogText = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner spinner" style="animation: spin 1s linear infinite;"></i> Saving Profile...'; 
            btn.disabled = true;

            let picUrl = profile.profile_pic || profile.profile_image || null;
            const fileInput = document.getElementById('profilePic');

            if (fileInput.files && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const ext = file.name.split('.').pop().toLowerCase();
                const fileName = \`client_\${currentUserId}_\${Date.now()}.\${ext}\`;
                
                try {
                    // 1. Try uploading to Supabase Storage bucket 'job_images'
                    const { data: uploadData, error: upErr } = await supabase.storage
                        .from('job_images')
                        .upload(fileName, file, { cacheControl: '3600', upsert: true });

                    if (!upErr && uploadData) {
                        const { data: { publicUrl } } = supabase.storage.from('job_images').getPublicUrl(fileName);
                        picUrl = publicUrl;
                    } else {
                        console.warn('Storage upload error or unconfigured bucket, using Base64 fallback:', upErr);
                        // Fallback: Convert image to Data URL Base64 string
                        picUrl = await fileToDataUrl(file);
                    }
                } catch (fileErr) {
                    console.warn('File processing error, using Base64 fallback:', fileErr);
                    picUrl = await fileToDataUrl(file);
                }
            }

            const firstNameVal = document.getElementById('firstName').value.trim();
            const lastNameVal = document.getElementById('lastName').value.trim();
            const phoneVal = document.getElementById('phone').value.trim();
            const addressVal = document.getElementById('address').value.trim();

            const updates = {
                first_name: firstNameVal,
                last_name: lastNameVal,
                phone: phoneVal,
                profile_pic: picUrl,
                profile_image: picUrl,
                updated_at: new Date().toISOString()
            };

            try {
                await supabase.auth.updateUser({ data: { address: addressVal, avatar_url: picUrl, first_name: firstNameVal, last_name: lastNameVal } });

                const { error } = await supabase.from('users').update(updates).eq('id', currentUserId);

                if (error) {
                    throw error;
                }

                await Swal.fire({ 
                    icon: 'success', 
                    title: 'Profile Updated!', 
                    text: 'Your profile details and photo have been updated successfully.', 
                    confirmButtonColor: '#10b981' 
                });
                window.location.href = 'dashboard.html';
            } catch (err) {
                console.error('Update error:', err);
                Swal.fire('Error', err.message || 'Failed to update profile.', 'error');
            } finally {
                btn.innerHTML = ogText; 
                btn.disabled = false;
            }
        });

        // Change Password Form
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;

            if (p1 !== p2) {
                Swal.fire('Warning', 'Passwords do not match.', 'warning');
                return;
            }

            const btn = document.getElementById('updatePwdBtn');
            btn.innerHTML = 'Updating...'; btn.disabled = true;

            const { error } = await supabase.auth.updateUser({ password: p1 });

            btn.innerHTML = '<i class="ph-bold ph-lock-key"></i> Update Password'; btn.disabled = false;

            if (error) {
                Swal.fire('Error', error.message, 'error');
            } else {
                Swal.fire({ icon: 'success', title: 'Password Changed!', text: 'Your password has been changed successfully.', confirmButtonColor: '#10b981' });
                document.getElementById('passwordForm').reset();
            }
        });
    });
</script>
</body>
</html>
